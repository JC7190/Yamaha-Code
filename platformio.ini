; Diagnosis ESP32 para Yamaha NMAX 125 (2023)
; Compilar:          pio run
; Subir firmware:    pio run -t upload
; Subir web (LittleFS): pio run -t uploadfs
; Monitor serie:     pio device monitor

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Arranca en modo simulador (1) o con la moto (0). También se cambia desde la web.
    -DSIMULADOR_POR_DEFECTO=1
lib_deps =
    esp32async/AsyncTCP @ 3.3.2
    esp32async/ESPAsyncWebServer @ 3.6.0
    bblanchon/ArduinoJson @ 7.2.1
